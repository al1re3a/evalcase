[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalcase"
version = "1.0.0"
description = "Provider-neutral, deterministic regression tests for agents and AI CLIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "agent", "evals", "testing", "cli", "regression"]

[project.scripts]
evalcase = "evalcase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
